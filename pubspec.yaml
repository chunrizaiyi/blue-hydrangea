name: blue_hydrangea
description: 一个只属于两个人的蓝色绣球花小花园。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.4
  sqflite: ^2.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/gentle_quotes.json
    - assets/audio/gentle_rain_50m.ogg
    - assets/audio/gentle_ocean_50m.ogg
    - assets/audio/gentle_breeze_50m.ogg
